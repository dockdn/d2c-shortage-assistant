const db=supabase.createClient("https://tmggolsyrfcrsjluuvgd.supabase.co","sb_publishable_R_b8pZEkadMpz-AE16aXkA_xIIbVdZn"),$=id=>document.getElementById(id);let page="home",latest=[];function showPage(p){page=p;$("home").hidden=p!=="home";$("jobs").hidden=p==="home";$("jobTitle").textContent=({open:"Open jobs",done:"Completed today",issues:"Reported issues"})[p]||"";document.activeElement?.blur();renderJobs(latest);window.scrollTo(0,0)}let user,active=false,known=new Set(),first=true,busy=false;const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function msg(v){$("message").textContent=v}async function init(){const {data}=await db.auth.getUser();user=data.user;if(!user){$("login").hidden=false;msg("Sign in with your approved workspace account.");return}const {data:m,error}=await db.from("workspace_members").select("role").eq("user_id",user.id).maybeSingle();$("logout").hidden=false;if(error||!m){msg("Workspace approval required.");return}active=true;$("login").hidden=true;$("app").hidden=false;await refresh()}$("login").onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)msg(error.message);else init()};$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};async function refresh(){if(!active||busy||document.activeElement?.closest("article"))return;const {data,error}=await db.from("runner_tasks").select("*").order("created_at");if(error)return msg(error.message);let pending=data.filter(t=>["Pending","In progress"].includes(t.status));pending.sort((a,b)=>["Urgent","Normal","Low"].indexOf(a.priority)-["Urgent","Normal","Low"].indexOf(b.priority)||Date.parse(a.oldest_order_at||a.created_at)-Date.parse(b.oldest_order_at||b.created_at));$("stats").replaceChildren(...[[pending.length,"Open jobs","open","▤"],[data.filter(t=>t.status==="Completed"&&new Date(t.updated_at).toDateString()===new Date().toDateString()).length,"Done today","done","✓"],[data.filter(t=>t.status==="Issue").length,"Issues","issues","!"]].map(([n,l,p,i])=>{const b=document.createElement("button");b.innerHTML="<small>"+i+"</small><b>"+n+"</b>"+l+" ›";b.onclick=()=>showPage(p);return b}));if(!first&&pending.some(t=>!known.has(t.id))) {navigator.vibrate?.(200);msg("New assignment received!")}else msg("Live queue · "+pending.length+" open");first=false;known=new Set(data.map(t=>t.id));latest=data;renderJobs(data)}
function renderJobs(data){if(page==="home")return;const expanded=new Set([...$("queue").querySelectorAll("details[open]")].map(e=>e.dataset.id));const rows=data.filter(t=>page==="open"?["Pending","In progress"].includes(t.status):page==="done"?t.status==="Completed"&&new Date(t.updated_at).toDateString()===new Date().toDateString():t.status==="Issue");rows.sort((a,b)=>page==="open"?["Urgent","Normal","Low"].indexOf(a.priority)-["Urgent","Normal","Low"].indexOf(b.priority)||Date.parse(a.oldest_order_at||a.created_at)-Date.parse(b.oldest_order_at||b.created_at):Date.parse(b.updated_at)-Date.parse(a.updated_at));$("queue").innerHTML=rows.map(t=>card(t,page==="open")).join("")||"<article>No jobs in this category.</article>";$("queue").querySelectorAll("details").forEach(e=>e.open=expanded.has(e.dataset.id));}

function card(t,open){return '<article class="'+(t.priority==="Urgent"?"urgent":"")+'"><details data-id="'+t.id+'"><summary>'+esc(t.sku)+' · '+esc(t.qty-t.pulled)+' remaining<br><small>'+esc(t.priority)+' · '+esc(t.oldest_order_at?new Date(t.oldest_order_at).toLocaleDateString():"Manual request")+'</small></summary><small>'+esc(t.kind)+' · '+esc(t.priority)+' · '+esc(t.status)+'</small><h2>'+esc(t.sku)+'</h2><strong>'+esc(t.qty-t.pulled)+' remaining</strong><p>'+esc(t.pulled)+' / '+esc(t.qty)+' pulled</p>'+t.locations.map((l,i)=>'<p><b>'+(i+1)+'. '+esc(l.location)+'</b><br>LPN: '+esc(l.lpn||"—")+'</p>').join("")+'<p>'+esc(t.instructions)+'</p><p>'+esc(t.result)+'</p>'+(open?'<label>Quantity found this trip<input id="q'+t.id+'" type="number" min="0" max="'+(t.qty-t.pulled)+'" value="'+(t.qty-t.pulled)+'"></label><label>Actual location / LPN or issue notes<textarea id="n'+t.id+'"></textarea></label><button onclick="save(\''+t.id+'\','+t.qty+','+t.pulled+',\''+esc(t.updated_at)+'\',false)">Confirm quantity pulled</button><button class="secondary" onclick="save(\''+t.id+'\','+t.qty+','+t.pulled+',\''+esc(t.updated_at)+'\',true)">Report issue / no stock</button>':"")+'</details></article>'}
async function save(id,qty,prev,version,issue){if(busy)return;const n=$("n"+id).value.trim(),v=issue?0:Number($("q"+id).value);if((issue&&!n)||(!issue&&(!Number.isInteger(v)||v<=0||v>qty-prev)))return msg("Enter a valid quantity or issue note.");busy=true;const {data,error}=await db.from("runner_tasks").update({pulled:prev+v,status:issue?"Issue":prev+v===qty?"Completed":"In progress",result:n,updated_at:new Date().toISOString()}).eq("id",id).eq("updated_at",version).select("id");busy=false;document.activeElement.blur();if(error||!data.length){msg(error?.message||"Task changed; refreshing.");await refresh();return}await refresh()}init();setInterval(refresh,4000);if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
