<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#253e35"><link rel="manifest" href="./manifest.webmanifest"><title>D2C Runner</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#f1f5f2;color:#253e35;margin:0}header{background:#253e35;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}main{max-width:600px;margin:auto;padding:14px}article,form{background:white;border-radius:14px;padding:16px;margin:12px 0;border:1px solid #dce5df}input,select,textarea,button{font:inherit;padding:14px;border-radius:8px;border:1px solid #aabbb0;width:100%;margin:5px 0}button{background:#315b48;color:white;font-weight:700;cursor:pointer}button.secondary{background:white;color:#315b48}header button{width:auto}small{color:#64766b}h2{overflow-wrap:anywhere}strong{font-size:22px} .urgent{border-left:6px solid #b44b41}label{display:block} [hidden]{display:none!important}</style></head><body><header><b>runner. / D2C</b><button class="secondary" id="logout" hidden>Sign out</button></header><main><p id="message" role="status">Connecting…</p><form id="login" hidden><h2>Sign in</h2><input id="email" type="email" placeholder="Work email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button><a href="/">Create account or reset password in D2C Assist</a></form><section id="app" hidden><h1>Assignments</h1><div id="queue"></div><details><summary>Completed / issues</summary><div id="history"></div></details></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>
const db=supabase.createClient("https://tmggolsyrfcrsjluuvgd.supabase.co","sb_publishable_R_b8pZEkadMpz-AE16aXkA_xIIbVdZn"),$=id=>document.getElementById(id);let user,active=false,known=new Set(),first=true,busy=false;const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function msg(v){$("message").textContent=v}async function init(){const {data}=await db.auth.getUser();user=data.user;if(!user){$("login").hidden=false;msg("Sign in with your approved workspace account.");return}const {data:m,error}=await db.from("workspace_members").select("role").eq("user_id",user.id).maybeSingle();$("logout").hidden=false;if(error||!m){msg("Workspace approval required.");return}active=true;$("login").hidden=true;$("app").hidden=false;await refresh()}$("login").onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)msg(error.message);else init()};$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};async function refresh(){if(!active||busy||document.activeElement?.closest("article"))return;const {data,error}=await db.from("runner_tasks").select("*").order("created_at");if(error)return msg(error.message);let pending=data.filter(t=>["Pending","In progress"].includes(t.status));pending.sort((a,b)=>["Urgent","Normal","Low"].indexOf(a.priority)-["Urgent","Normal","Low"].indexOf(b.priority));if(!first&&pending.some(t=>!known.has(t.id))) {navigator.vibrate?.(200);msg("New assignment received!")}else msg("Live queue · "+pending.length+" open");first=false;known=new Set(data.map(t=>t.id));$("queue").innerHTML=pending.map(t=>card(t,true)).join("")||"<article>All caught up.</article>";$("history").innerHTML=data.filter(t=>!pending.includes(t)).reverse().map(t=>card(t,false)).join("")}
function card(t,open){return '<article class="'+(t.priority==="Urgent"?"urgent":"")+'"><small>'+esc(t.kind)+' · '+esc(t.priority)+' · '+esc(t.status)+'</small><h2>'+esc(t.sku)+'</h2><strong>'+esc(t.qty-t.pulled)+' remaining</strong><p>'+esc(t.pulled)+' / '+esc(t.qty)+' pulled</p>'+t.locations.map((l,i)=>'<p><b>'+(i+1)+'. '+esc(l.location)+'</b><br>LPN: '+esc(l.lpn||"—")+'</p>').join("")+'<p>'+esc(t.instructions)+'</p><p>'+esc(t.result)+'</p>'+(open?'<label>Quantity found this trip<input id="q'+t.id+'" type="number" min="0" max="'+(t.qty-t.pulled)+'" value="'+(t.qty-t.pulled)+'"></label><label>Actual location / LPN or issue notes<textarea id="n'+t.id+'"></textarea></label><button onclick="save(\''+t.id+'\','+t.qty+','+t.pulled+',\''+esc(t.updated_at)+'\',false)">Confirm quantity pulled</button><button class="secondary" onclick="save(\''+t.id+'\','+t.qty+','+t.pulled+',\''+esc(t.updated_at)+'\',true)">Report issue / no stock</button>':"")+'</article>'}
async function save(id,qty,prev,version,issue){if(busy)return;const n=$("n"+id).value.trim(),v=issue?0:Number($("q"+id).value);if((issue&&!n)||(!issue&&(!Number.isInteger(v)||v<=0||v>qty-prev)))return msg("Enter a valid quantity or issue note.");busy=true;const {data,error}=await db.from("runner_tasks").update({pulled:prev+v,status:issue?"Issue":prev+v===qty?"Completed":"In progress",result:n,updated_at:new Date().toISOString()}).eq("id",id).eq("updated_at",version).select("id");busy=false;document.activeElement.blur();if(error||!data.length){msg(error?.message||"Task changed; refreshing.");await refresh();return}await refresh()}init();setInterval(refresh,4000);if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
